:root{--ink:#182d35;--muted:#567078;--teal:#007f78;--paper:#f5f6ef;--line:#d6e0da}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 system-ui,sans-serif}header{border-bottom:1px solid var(--line);padding:20px 5%;display:flex;justify-content:space-between;gap:12px;align-items:center}main{max-width:1100px;margin:auto;padding:36px 24px}h1{font:700 clamp(36px,6vw,70px)/1.06 Georgia,serif;letter-spacing:-2px;margin:15px 0 25px}h2{font:700 32px/1.2 Georgia,serif}h3{margin:0 0 10px}p{max-width:760px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--teal);text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:24px}.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:36px;align-items:center}.scene-image{width:100%;display:block;border-radius:16px;margin-bottom:20px}.art{background:#e5eee5;border-radius:24px;padding:20px}button,.button{font:inherit;background:var(--teal);color:white;border:0;border-radius:9px;padding:12px 20px;cursor:pointer;display:inline-block;margin:8px 8px 0 0}button.secondary{background:#e4ebe5;color:var(--ink)}button:hover{filter:brightness(.94)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #dd862c;outline-offset:3px}label{display:block;font-weight:600;margin:15px 0 6px}select,textarea,input[type=text]{width:100%;font:inherit;padding:11px;border:1px solid #9daea6;border-radius:8px;background:white}textarea{min-height:100px}input[type=range]{width:100%;accent-color:var(--teal)}.muted{color:var(--muted);font-size:14px}.pill{border:1px solid var(--line);border-radius:30px;padding:4px 12px;font-size:13px}.notice{border-left:4px solid #db912e;background:#fff3df;padding:16px;border-radius:4px}.progress{height:5px;background:#dde5dd}.progress div{height:100%;background:var(--teal)}svg{width:100%;height:auto}.chart{min-height:170px}.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.stat{font-size:34px;font-weight:750}.hidden{display:none}table{width:100%;border-collapse:collapse;font-size:15px}td,th{text-align:left;padding:12px;border-bottom:1px solid var(--line)}footer{max-width:1100px;margin:auto;padding:30px 24px;color:var(--muted);font-size:13px}details{margin:18px 0}summary{cursor:pointer;font-weight:650}@media(max-width:760px){.grid,.hero{grid-template-columns:1fr}header{flex-wrap:wrap}main{padding:24px 16px}h1{letter-spacing:-1px}}

'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'RM '+n.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const initial=()=>({step:0,role:'Analyst',claim:'opportunity',confidence:60,reason:'',opened:[],q:750,hedge:true,borrow:12,plan:'hold',world:'widen',response:'hold',reflection:'',events:[]});let s=initial();
const files={rights:['Fund constitution','The fictional Meranti Closed-End Fund trades on an exchange. Ordinary investors cannot redeem individual shares at NAV. There is no approved liquidation, conversion or tender offer. Buying at RM8 does not grant a right to receive RM10 immediately.'],nav:['NAV worksheet','Reported NAV is RM10 per share. Some holdings are illiquid and their valuations lag. Ongoing fees and governance can affect what an investor is willing to pay. The replicating basket is a liquid proxy, not a legally identical claim.'],borrow:['Prime broker quote','A proxy basket can currently be borrowed, at an illustrative 12% annual rate on its initial RM10 notional per fund share. Borrow availability may be withdrawn. Long financing is 6% annually on RM8. Round-trip transaction costs are RM0.06 per fund share.'],funding:['Risk committee memo','Capital is RM20,000. Short-sale proceeds are ring-fenced. The simplified account reserves RM8 per long share plus collateral of 50% of the current proxy price per hedged share. Losses and carry consume the remaining liquidity. Negative liquidity triggers forced closure.'],catalyst:['Catalyst assessment','Management may consider a buyback, but nothing is binding. A discount can narrow, persist or widen. No event guarantees convergence at a specified date.']};
const worlds={converge:{title:'A catalyst arrives',news:'A credible tender announcement narrows the discount. It was not guaranteed at entry.',points:[{t:1,nav:10,p:8.8,b:10},{t:6,nav:10.5,p:10.29,b:10.5}]},widen:{title:'The discount widens',news:'Investors retreat from the fund. The discount reaches 40%, while the proxy basket rises. A correct long-run thesis can still face a damaging interim loss.',points:[{t:1,nav:11,p:6.6,b:11},{t:6,nav:10,p:7,b:10}]},model:{title:'The valuation is challenged',news:'Illiquid holdings are marked down. The reported NAV and liquid proxy diverge. Your hedge cannot perfectly offset the fund’s holdings.',points:[{t:1,nav:8.5,p:7.65,b:9.8},{t:6,nav:8,p:7.6,b:8.7}]}};
function cost(t,q=s.q){return q*(.06+.06*8*t/12+(s.hedge?s.borrow/100*10*t/12:0))}
function outcome(point,q=s.q){let gross=q*((point.p-8)+(s.hedge?10-point.b:0)),carry=cost(point.t,q),net=gross-carry,liquidity=20000-q*8-(s.hedge?q*.5*point.b:0)+net;return{gross,cost:carry,net,liquidity,equity:20000+net}}
function route(){if(!s.q)return ['The Patient Observer','You waited for stronger evidence. You avoided trading losses and gave up any gains from convergence.'];let p=worlds[s.world].points[0],o=outcome(p);if(o.liquidity<0)return ['The Funding Trap','The account could not carry the position through the first shock. It was closed before a later recovery could help.'];if(!s.hedge)return ['The Directional Investor','Without the short leg, the position depends on the fund price itself. This is a directional investment rather than a matched convergence trade.'];if(s.world==='model')return ['The Model Challenger','The fund and proxy were not identical claims. Changes in the valuation and hedge basis exposed model risk.'];if(s.response==='exit')return ['The Early Exit','You closed after the first shock. Your decision limited further exposure while surrendering the later outcome.'];if(s.world==='converge')return ['The Catalyst Survivor','Your position benefited from convergence. The outcome does not make the original trade risk-free.'];return ['The Persistent Discount','The gap remained after six months. Carry costs reduced the value of waiting.']}
function report(){let [title,feedback]=route();let p=worlds[s.world].points[s.response==='exit'||outcome(worlds[s.world].points[0]).liquidity<0?0:1],o=outcome(p);return `# The Price Paradox · Learning Journey

Role: ${s.role}
Initial claim: ${s.claim}
Initial confidence: ${s.confidence}%
Initial reasoning: ${s.reason}
Evidence opened: ${s.opened.join(', ')}
Position: ${s.q} shares
Proxy hedge: ${s.hedge}
Borrow rate: ${s.borrow}%
Precommitted plan: ${s.plan}
Case: ${s.world}
Response: ${s.response}
Ending: ${title}

${feedback}

Net P&L: ${money(o.net)}
Closing equity: ${money(o.equity)}
Reflection: ${s.reflection}

## Road Not Taken
No position has zero trading P&L. A smaller position changes funding resilience. An unhedged position exposes the fund price. A hedged position exposes convergence, carry and proxy mismatch. Earlier exit changes the holding period and future exposure.

## Debrief
A price/NAV gap alone is not a guaranteed arbitrage. Compare legal rights, cash flows and executable conversion mechanisms. Test valuation assumptions, hedge quality, borrow availability, costs and interim funding. The model assumes no distributions, taxes or interest on unused cash, fixed borrowing costs and ring-fenced short proceeds. Actual implementation would need more detail.

Source: Bodie, Kane & Marcus Investments 12e Chapter 12 slides 8–11. All cases are fictional.
`}

function chart(){let ps=[{t:0,nav:10,p:8,b:10},...worlds[s.world].points];let line=key=>ps.map((p,i)=>`${60+i*230},${210-(p[key]-5)*24}`).join(' ');return `<svg viewBox="0 0 600 270" role="img" aria-label="Entry, month one and month six prices in the selected case"><path d="M60 30V210H540" stroke="#abc0b4" fill="none"/>${['nav','p','b'].map((k,i)=>`<polyline points="${line(k)}" fill="none" stroke="${['#b36f30','#007f78','#65748b'][i]}" stroke-width="3" ${k==='b'?'stroke-dasharray="5 5"':''}/>`).join('')}<text x="50" y="235" font-size="13">Entry</text><text x="260" y="235" font-size="13">Month 1</text><text x="485" y="235" font-size="13">Month 6</text><text x="60" y="260" font-size="12">Teal · Fund price    Amber · NAV    Dashed · Proxy</text></svg>`}
function go(n){if('speechSynthesis'in window)speechSynthesis.cancel();s.step=n;try{localStorage.setItem('price-paradox-v1',JSON.stringify(s))}catch{}render();window.scrollTo(0,0)}
function next(label='Continue'){return `<p id="error" role="alert"></p><button id="next">${label} →</button>`}

if(n===1)h=`<div class="eyebrow">01 / The desk briefing</div><h2>Is the discount an opportunity?</h2><div class="grid"><div class="card"><span class="muted">Reported NAV per share</span><div class="stat">RM10.00</div></div><div class="card"><span class="muted">Fund market price</span><div class="stat">RM8.00</div></div><div class="card"><span class="muted">Discount relative to NAV</span><div class="stat">20%</div></div></div><p>The discount is (10 − 8) ÷ 10. A rise from RM8 to RM10 would be 25% of the purchase price, before costs. Neither calculation says that convergence will happen.</p><p>As ${esc(s.role)}, state your initial position before opening the files.</p><label for="claim">Your working hypothesis</label><select id="claim"><option value="opportunity">A possible convergence opportunity</option><option value="arbitrage">A guaranteed arbitrage</option><option value="unclear">Insufficient evidence</option></select><label for="confidence">Confidence <span id="cv">60</span>%</label><input id="confidence" type="range" min="0" max="100" value="60"><label for="reason">Why? What assumption would invalidate your conclusion?</label><textarea id="reason" placeholder="Make your reasoning visible before investigating."></textarea>${next('Lock initial judgement')}`;
if(n===2)h=`<div class="eyebrow">02 / Evidence room</div><h2>Open the files that your thesis needs.</h2><p>Your original judgement is locked. Read at least three files before recommending a trade. Every file is available; there is no penalty for investigating further.</p><div class="grid">${Object.entries(files).map(([id,[title,text]])=>`<div class="card"><h3>${title}</h3><button class="secondary" data-file="${id}">${s.opened.includes(id)?'Reviewed':'Open file'}</button>${s.opened.includes(id)?`<p>${text}</p>`:''}</div>`).join('')}</div><p class="muted">${s.opened.length}/5 files reviewed</p>${next('Build the trade')}`;
if(n===3)h=`<div class="eyebrow">03 / Implementation desk</div><h2>How much can you afford to wait?</h2><div class="hero"><div class="card"><label for="q">Long fund position</label><select id="q">${[0,250,750,1250].map(q=>`<option value="${q}" ${q===s.q?'selected':''}>${q===0?'No trade':q+' shares'}</option>`).join('')}</select><label for="hedge">Short the liquid proxy basket?</label><select id="hedge"><option value="yes" ${s.hedge?'selected':''}>Yes · one RM10 proxy unit per fund share</option><option value="no" ${!s.hedge?'selected':''}>No · directional fund investment</option></select><label for="borrow">Annual proxy borrowing rate <span id="bv">${s.borrow}</span>%</label><input id="borrow" type="range" min="4" max="24" step="1" value="${s.borrow}"><label for="plan">Precommit your response to a wider discount</label><select id="plan"><option value="hold">Hold while funding permits</option><option value="exit">Close after the first shock</option></select></div><div><div id="calc"></div><div class="notice">The proxy is not a legally identical claim. Even a perfectly matched short basket would not give you a right to redeem the fund at NAV.</div><details><summary>Model assumptions and formula</summary><p>Capital RM20,000. Long fund purchase RM8 per share. Short proceeds are ring-fenced. Initial collateral is 50% × RM10 per hedged share. Gross P&L = shares × [(exit fund price − 8) + (10 − exit proxy price)] for a hedged trade. Carry = shares × [0.06 round-trip costs + 6% × 8 × months/12 + borrow rate × 10 × months/12]. No distributions, taxes, income on cash or rate changes. Interim liquidity = capital − original long cost − current proxy collateral + net P&L. This is an illustrative funding convention.</p></details></div></div>${next('Commit position')}`;
if(n===4){let p=worlds[s.world].points[0],o=outcome(p);h=`<div class="eyebrow">04 / One month later</div><h2>${worlds[s.world].title}</h2><p>${worlds[s.world].news}</p><div class="grid"><div class="card"><h3>Fund / NAV / Proxy</h3><p>${money(p.p)} / ${money(p.nav)} / ${money(p.b)}</p><span class="muted">Discount ${(100*(1-p.p/p.nav)).toFixed(1)}%</span></div><div class="card"><h3>Close-now net P&L</h3><div class="stat">${money(o.net)}</div></div><div class="card"><h3>Remaining liquidity</h3><div class="stat">${money(o.liquidity)}</div></div></div><p class="muted">Close-now figures include the full assumed round-trip transaction cost. Later P&L is cumulative from entry, not added to this figure.</p>${o.liquidity<0?'<div class="notice">Funding breach. The broker forces closure now. Later convergence cannot rescue this position.</div>':`<label for="response">Your decision now</label><select id="response"><option value="hold" ${s.plan==='hold'?'selected':''}>Continue to month six</option><option value="exit" ${s.plan==='exit'?'selected':''}>Close now</option></select><p>Your precommitted plan was to ${s.plan==='hold'?'hold while funded':'close after the first shock'}. You can revise it in response to evidence.</p>`}${next('Reveal the outcome')}`}
if(n===5){let breached=outcome(worlds[s.world].points[0]).liquidity<0,p=worlds[s.world].points[breached||s.response==='exit'?0:1],o=outcome(p),[title,feedback]=route();h=`<div class="eyebrow">05 / Investment committee review</div><h1>${title}</h1><p>${feedback}</p><div class="hero"><div class="card">${chart()}<p class="muted">The full case is shown for comparison, including observations after any early closure.</p></div><div><table><tr><th>Closing month</th><td>${p.t}</td></tr><tr><th>Gross P&L</th><td>${money(o.gross)}</td></tr><tr><th>Costs and carry</th><td>${money(o.cost)}</td></tr><tr><th>Net P&L</th><td>${money(o.net)}</td></tr><tr><th>Closing account equity</th><td>${money(o.equity)}</td></tr></table></div></div><label for="reflection">Which assumption mattered most, and what evidence would you require before calling this arbitrage?</label><textarea id="reflection"></textarea>${next('Create my learning report')}`}
if(n===6){let p=worlds[s.world].points[1];h=`<div class="eyebrow">06 / Making thinking visible</div><h2>Your Learning Journey</h2><div class="card"><p><strong>Initial judgement</strong> · ${esc(s.claim)} at ${s.confidence}% confidence</p><p>${esc(s.reason)}</p><p><strong>Final reflection</strong></p><p>${esc(s.reflection)}</p><button id="report">Download report (.md)</button></div><h2>The Road Not Taken</h2><div class="grid">${[0,250,750,1250].map(q=>{let forced=outcome(worlds[s.world].points[0],q).liquidity<0,cp=worlds[s.world].points[forced?0:1];return `<div class="card"><h3>${q} shares</h3><p>${money(outcome(cp,q).net)} net P&L</p><span class="muted">Same hedge and rate; ${forced?'forced closure at month one':'held to month six'}.</span></div>`}).join('')}</div><h2>Three questions for the debrief</h2><ol><li>Do the two instruments give the same enforceable cash-flow rights?</li><li>Can you execute the conversion or hedge, after costs and restrictions?</li><li>Can you remain funded if the discrepancy widens before it narrows?</li></ol><p>A closed-end fund’s NAV and share price refer to different claims. A discount alone does not prove an inconsistency with the law of one price. Fees, control rights, liquidity, valuation uncertainty and demand can matter. A risky convergence strategy may still be attractive, but its case needs more than a price gap.</p><details><summary>Explore another possible world</summary><p>These cases are not assigned probabilities. Select one to stress-test a new run. The chosen world is held fixed while you make decisions.</p>${Object.keys(worlds).map(k=>`<button class="secondary" data-world="${k}">${worlds[k].title}</button>`).join('')}</details><button id="again">New investigation</button>`}
$('#app').innerHTML=h;
$('#confidence')?.addEventListener('input',e=>$('#cv').textContent=e.target.value);
for(let id of ['q','hedge','borrow'])$('#'+id)?.addEventListener('input',()=>{syncTrade();calc()});if(n===3)calc();
document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>{if(!s.opened.includes(b.dataset.file))s.opened.push(b.dataset.file);go(2)});
$('#next')?.addEventListener('click',()=>{if(n===0)s.role=$('#role').value;if(n===1){let r=$('#reason').value.trim();if(r.length<15){$('#error').textContent='Add a reason and an assumption that could invalidate it (at least 15 characters).';return}s.reason=r;s.claim=$('#claim').value;s.confidence=Number($('#confidence').value)}if(n===2&&s.opened.length<3){$('#error').textContent='Review at least three evidence files before committing.';return}if(n===3){syncTrade();s.plan=$('#plan').value}if(n===4)s.response=outcome(worlds[s.world].points[0]).liquidity<0?'forced':$('#response').value;if(n===5){s.reflection=$('#reflection').value.trim();if(s.reflection.length<15){$('#error').textContent='Add a short reflection about your assumptions before continuing.';return}}go(n+1)});
$('#report')?.addEventListener('click',()=>download('Price_Paradox_Learning_Journey.md',report()));$('#again')?.addEventListener('click',()=>restart());document.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>restart(b.dataset.world));}
function syncTrade(){s.q=Number($('#q').value);s.hedge=$('#hedge').value==='yes';s.borrow=Number($('#borrow').value)}
function calc(){let entry=s.q*(8+(s.hedge?5:0)),c=cost(6),full=s.q*2-c;$('#bv').textContent=s.borrow;$('#calc').innerHTML=`<h3>Capital reserved at entry</h3><div class="stat">${money(entry)}</div><p>Remaining initial liquidity ${money(20000-entry)}.</p><h3>Six-month costs</h3><div class="stat">${money(c)}</div><p>If the fund reached RM10 and the proxy stayed at RM10, net P&L would be ${money(full)}. This is a conditional illustration, not a forecast.</p>`}
function restart(world){if(s.step&&!confirm('Start a new run? Download your report first if you want to keep it.'))return;s=initial();if(world)s.world=world;else{s.world=['converge','widen','model'][Math.floor(Math.random()*3)]}go(0)}
$('#restart').onclick=()=>restart();$('#voice').onclick=()=>{if(!('speechSynthesis'in window)){alert('Narration is unavailable in this browser. All content is available as text.');return}speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance($('#app').innerText))};$('#stop').onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel()};
try{let saved=JSON.parse(localStorage.getItem('price-paradox-v1'));if(saved&&Number.isInteger(saved.step)&&saved.step>=0&&saved.step<=6&&worlds[saved.world]&&Array.isArray(saved.opened))s=saved;else s.world=['converge','widen','model'][Math.floor(Math.random()*3)]}catch{}render();
</script></html>
